<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="photoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a201b" />
      <stop offset="50%" stop-color="#3c2f28" />
      <stop offset="100%" stop-color="#181310" />
    </linearGradient>
    <linearGradient id="featherGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efd8a1" />
      <stop offset="25%" stop-color="#cf9456" />
      <stop offset="50%" stop-color="#8a532d" />
      <stop offset="75%" stop-color="#3f5a5b" />
      <stop offset="100%" stop-color="#82a5a5" />
    </linearGradient>
    <radialGradient id="bokeh1" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f5e1b5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f5e1b5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh2" cx="70%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#c1e3db" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c1e3db" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background wooden / dark textured surface -->
  <rect width="600" height="450" fill="url(#photoBg)" />
  
  <!-- Subtle woodgrain lines -->
  <g stroke="#4f3e35" stroke-width="1.2" opacity="0.4" fill="none">
    <path d="M0,80 Q200,90 600,75" />
    <path d="M0,170 Q350,155 600,180" />
    <path d="M0,260 Q180,275 600,250" />
    <path d="M0,350 Q400,340 600,365" />
  </g>

  <!-- Dreamy photographic bokeh circles -->
  <circle cx="120" cy="110" r="70" fill="url(#bokeh1)" />
  <circle cx="480" cy="320" r="95" fill="url(#bokeh2)" />
  <circle cx="210" cy="360" r="45" fill="url(#bokeh1)" opacity="0.6" />
  <circle cx="450" cy="120" r="55" fill="url(#bokeh1)" opacity="0.4" />

  <!-- Macro Feather (Iridescent Kingfisher / Jay / Pheasant feather) -->
  <g transform="translate(300, 225) rotate(-32)">
    <!-- Feather shadow -->
    <path d="M-180,18 C-120,-30 80,-40 220,18 C120,45 -60,40 -180,18 Z" fill="#0c0a08" opacity="0.6" filter="blur(8px)" />

    <!-- Feather main vanes (top and bottom) -->
    <!-- Top vane with detailed barb texture -->
    <path d="M-190,0 C-130,-48 70,-56 210,0 C110,-10 -60,-12 -190,0 Z" fill="url(#featherGrad1)" opacity="0.95" />
    <!-- Bottom vane -->
    <path d="M-190,0 C-120,44 80,48 210,0 C100,12 -70,10 -190,0 Z" fill="url(#featherGrad1)" opacity="0.88" />

    <!-- Shaft / Rachis (central quill) -->
    <path d="M-225,0 C-100,-4 100,-2 215,0" fill="none" stroke="#f6eccd" stroke-width="4.5" stroke-linecap="round" />
    <path d="M-225,0 C-100,-4 100,-2 215,0" fill="none" stroke="#926338" stroke-width="2.5" stroke-linecap="round" />

    <!-- Calamus (quill base) -->
    <path d="M-225,0 L-250,0" stroke="#f9f2dd" stroke-width="5" stroke-linecap="round" />

    <!-- Fine barbs texturing -->
    <g stroke="#35261c" stroke-width="1.1" opacity="0.35">
      <line x1="-120" y1="-2" x2="-145" y2="-28" /><line x1="-80" y1="-2" x2="-100" y2="-38" />
      <line x1="-40" y1="-2" x2="-55" y2="-42" /><line x1="0" y1="-2" x2="-10" y2="-44" />
      <line x1="40" y1="-1" x2="35" y2="-40" /><line x1="80" y1="0" x2="80" y2="-34" />
      <line x1="120" y1="0" x2="130" y2="-26" /><line x1="160" y1="0" x2="180" y2="-15" />

      <line x1="-120" y1="2" x2="-140" y2="24" /><line x1="-80" y1="2" x2="-95" y2="34" />
      <line x1="-40" y1="2" x2="-50" y2="38" /><line x1="0" y1="2" x2="-5" y2="38" />
      <line x1="40" y1="1" x2="40" y2="35" /><line x1="80" y1="0" x2="85" y2="30" />
      <line x1="120" y1="0" x2="135" y2="22" /><line x1="160" y1="0" x2="180" y2="13" />
    </g>

    <!-- Downy barbs near base -->
    <g stroke="#ebd7a7" stroke-width="1.4" opacity="0.8">
      <path d="M-180,0 C-195,-12 -210,-8 -220,-18" fill="none" />
      <path d="M-170,0 C-185,-16 -198,-14 -212,-25" fill="none" />
      <path d="M-180,0 C-195,12 -210,8 -220,18" fill="none" />
      <path d="M-170,0 C-185,16 -198,14 -212,25" fill="none" />
    </g>
  </g>

  <!-- Golden light reflection / glint -->
  <g transform="translate(340, 195)">
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="drop-shadow(0 0 10px #ffe5a3)" />
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Vintage Camera Viewfinder Reticle Framing in corners -->
  <g stroke="#9e7b57" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M30,50 L30,30 L50,30" />
    <path d="M570,50 L570,30 L550,30" />
    <path d="M30,400 L30,420 L50,420" />
    <path d="M570,400 L570,420 L550,420" />
    <!-- Center crosshair -->
    <line x1="290" y1="225" x2="310" y2="225" />
    <line x1="300" y1="215" x2="300" y2="235" />
  </g>

  <rect x="0" y="0" width="600" height="450" fill="none" stroke="#6b4c34" stroke-width="3" opacity="0.35" />
</svg>
