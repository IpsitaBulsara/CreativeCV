<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita Journal CV - Creative Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italianno&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: linear-gradient(135deg, #8B7355 0%, #9D8B7E 50%, #A89589 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .journal-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            perspective: 1000px;
        }

        .journal-book {
            background: linear-gradient(135deg, #D4A5A5 0%, #C9938F 50%, #BF8B86 100%);
            border-radius: 0px;
            padding: 60px 50px;
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.5),
                inset -15px 0 30px rgba(0, 0, 0, 0.15),
                inset 15px 0 30px rgba(255, 255, 255, 0.05);
            position: relative;
            border: 2px solid #9D7E6F;
        }

        .journal-book::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.3), transparent);
        }

        .journal-book::after {
            content: '';
            position: absolute;
            left: 12px;
            top: 30px;
            bottom: 30px;
            width: 2px;
            background: repeating-linear-gradient(
                0deg,
                rgba(90, 58, 53, 0.3) 0px,
                rgba(90, 58, 53, 0.3) 3px,
                transparent 3px,
                transparent 12px
            );
        }

        .bookmark {
            position: absolute;
            right: -8px;
            top: 35%;
            width: 35px;
            height: 140px;
            background: linear-gradient(90deg, #B8948C, #C4A090);
            box-shadow: -2px 0 6px rgba(0, 0, 0, 0.2);
            transform: rotate(-5deg);
            border: 1px solid #9D7E6F;
        }

        .bookmark::after {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 16px;
            background: linear-gradient(180deg, #B8948C, #8B6B60);
            clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
        }

        .journal-content {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .decorative-top {
            font-size: 1.8em;
            letter-spacing: 0.25em;
            color: rgba(90, 58, 53, 0.65);
            margin-bottom: 20px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .title {
            font-family: 'Italianno', cursive;
            font-size: 5.5em;
            color: #5A3A35;
            margin: 20px 0;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.4em;
            color: #6B4C47;
            font-style: italic;
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(90, 58, 53, 0.4), transparent);
            margin: 25px auto;
        }

        .heart {
            color: #9D7E6F;
            font-size: 1.2em;
            margin: 0 10px;
        }

        .tagline {
            font-family: 'Caveat', cursive;
            font-size: 1.8em;
            color: #6B4C47;
            margin: 20px 0;
            font-weight: 500;
            line-height: 1.6;
        }

        .decorative-elements {
            position: absolute;
            font-size: 3em;
            opacity: 0.1;
            font-weight: 300;
            color: #5A3A35;
        }

        .element-top-left {
            top: 20px;
            left: 20px;
        }

        .element-top-right {
            top: 20px;
            right: 20px;
        }

        .element-bottom-left {
            bottom: 20px;
            left: 20px;
        }

        .element-bottom-right {
            bottom: 20px;
            right: 20px;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 55px;
            margin-top: 30px;
            background: linear-gradient(135deg, #9D7E6F, #8B6B60);
            color: #F5E6E0;
            text-decoration: none;
            border-radius: 0px;
            font-size: 1.15em;
            letter-spacing: 0.1em;
            border: 2px solid #7A5A52;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #8B6B60, #7A5A52);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9em;
            color: rgba(90, 58, 53, 0.55);
            letter-spacing: 0.1em;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 3.8em;
            }

            .subtitle {
                font-size: 1.1em;
            }

            .tagline {
                font-size: 1.3em;
            }

            .journal-book {
                padding: 40px 30px;
            }

            .journal-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="journal-container">
        <div class="journal-book">
            <div class="decorative-elements element-top-left">✦</div>
            <div class="decorative-elements element-top-right">✦</div>
            <div class="decorative-elements element-bottom-left">✦</div>
            <div class="decorative-elements element-bottom-right">✦</div>

            <div class="bookmark"></div>

            <div class="journal-content">
                <div class="decorative-top">collect beautiful moments</div>

                <div class="title">Journal</div>

                <div class="subtitle">Dreams. Plans. Memories.</div>
                <div class="subtitle">All the little things</div>

                <div class="divider"></div>

                <div class="tagline">
                    A journal of the things that make me, me
                </div>

                <div class="divider"></div>

                <p style="font-family: 'Caveat', cursive; font-size: 1.5em; color: #6B4C47; margin: 20px 0; font-weight: 500;">
                    curiosity <span class="heart">•</span> people <span class="heart">•</span> places <span class="heart">•</span> creativity
                </p>

                <a href="Ipsita Journal CV.dc.html" class="cta-button">Open the Journal</a>

                <div class="footer">
                    <p style="margin-top: 30px; font-size: 0.85em; letter-spacing: 0.15em;">Written and assembled by Ipsita</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
