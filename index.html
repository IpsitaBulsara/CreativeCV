<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita Journal CV - Creative Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italianno&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: linear-gradient(135deg, #8B5A5A 0%, #6B4C47 50%, #4A3635 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .journal-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            perspective: 1000px;
        }

        .journal-book {
            background: linear-gradient(135deg, #D4A5A5 0%, #C9938F 100%);
            border-radius: 20px;
            padding: 50px 45px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset -10px 0 20px rgba(0, 0, 0, 0.2),
                inset 10px 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
            border: 2px solid #A88080;
        }

        .journal-book::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.3), transparent);
            border-radius: 20px 0 0 20px;
        }

        .journal-book::after {
            content: '';
            position: absolute;
            left: 12px;
            top: 20px;
            bottom: 20px;
            width: 3px;
            background: repeating-linear-gradient(
                0deg,
                rgba(139, 69, 69, 0.3) 0px,
                rgba(139, 69, 69, 0.3) 2px,
                transparent 2px,
                transparent 8px
            );
            border-radius: 2px;
        }

        .bookmark {
            position: absolute;
            right: -5px;
            top: 30%;
            width: 35px;
            height: 140px;
            background: linear-gradient(90deg, #D4A5A5, #E8C4B4);
            border-radius: 3px;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
            transform: rotate(-5deg);
        }

        .bookmark::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 18px;
            background: linear-gradient(180deg, #D4A5A5, #A88080);
            clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
        }

        .journal-content {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .decorative-top {
            font-size: 2.2em;
            letter-spacing: 0.3em;
            color: rgba(107, 76, 71, 0.6);
            margin-bottom: 25px;
            font-weight: 400;
        }

        .title {
            font-family: 'Italianno', cursive;
            font-size: 5.5em;
            color: #5A3A35;
            margin: 25px 0;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.55em;
            color: #6B4C47;
            font-style: italic;
            margin-bottom: 18px;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(90, 58, 53, 0.4), transparent);
            margin: 30px auto;
        }

        .heart {
            color: #A88080;
            font-size: 1.3em;
            margin: 0 12px;
        }

        .tagline {
            font-family: 'Caveat', cursive;
            font-size: 2em;
            color: #6B4C47;
            margin: 25px 0;
            font-weight: 500;
            line-height: 1.6;
        }

        .decorative-elements {
            position: absolute;
            font-size: 3.5em;
            opacity: 0.15;
            font-weight: 300;
        }

        .element-top-left {
            top: 15px;
            left: 15px;
            color: #5A3A35;
        }

        .element-top-right {
            top: 15px;
            right: 15px;
            color: #5A3A35;
        }

        .element-bottom-left {
            bottom: 15px;
            left: 15px;
            color: #5A3A35;
        }

        .element-bottom-right {
            bottom: 15px;
            right: 15px;
            color: #5A3A35;
        }

        .cta-button {
            display: inline-block;
            padding: 18px 60px;
            margin-top: 35px;
            background: linear-gradient(135deg, #8B5A5A, #6B4C47);
            color: #F5E6E0;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2em;
            letter-spacing: 0.1em;
            border: 2px solid #6B4C47;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #6B4C47, #5A3A35);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.95em;
            color: rgba(90, 58, 53, 0.5);
            letter-spacing: 0.1em;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 3.8em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            .tagline {
                font-size: 1.4em;
            }

            .journal-book {
                padding: 35px 30px;
            }

            .journal-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="journal-container">
        <div class="journal-book">
            <div class="decorative-elements element-top-left">✦</div>
            <div class="decorative-elements element-top-right">✦</div>
            <div class="decorative-elements element-bottom-left">✦</div>
            <div class="decorative-elements element-bottom-right">✦</div>

            <div class="bookmark"></div>

            <div class="journal-content">
                <div class="decorative-top">collect beautiful moments</div>

                <div class="title">Journal</div>

                <div class="subtitle">Dreams. Plans. Memories.</div>
                <div class="subtitle">All the little things</div>

                <div class="divider"></div>

                <div class="tagline">
                    A journal of the things that make me, me
                </div>

                <div class="divider"></div>

                <p style="font-family: 'Caveat', cursive; font-size: 1.6em; color: #6B4C47; margin: 25px 0; font-weight: 500;">
                    curiosity <span class="heart">•</span> people <span class="heart">•</span> places <span class="heart">•</span> creativity
                </p>

                <a href="Ipsita Journal CV.dc.html" class="cta-button">Open the Journal</a>

                <div class="footer">
                    <p style="margin-top: 35px; font-size: 0.9em; letter-spacing: 0.15em;">Written and assembled by Ipsita</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
