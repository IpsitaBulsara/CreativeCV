<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita Journal CV</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italianno&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: #1d140d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .book-container {
            position: relative;
            width: 100%;
            max-width: 620px;
            height: 780px;
            perspective: 1000px;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f3e6cc 0%, #faf6f0 100%);
            border: 2px solid #3a2415;
            box-shadow: 
                0 44px 60px rgba(0, 0, 0, 0.6),
                inset -15px 0 30px rgba(45, 26, 15, 0.2),
                inset 15px 0 30px rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 70px 58px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .book::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 10px;
            background: linear-gradient(90deg, rgba(45, 26, 15, 0.3), transparent);
        }

        .book::after {
            content: '';
            position: absolute;
            left: 12px;
            top: 28px;
            bottom: 28px;
            width: 2px;
            background: repeating-linear-gradient(
                0deg,
                rgba(90, 58, 53, 0.2) 0px,
                rgba(90, 58, 53, 0.2) 2px,
                transparent 2px,
                transparent 10px
            );
        }

        .book:hover {
            transform: translateY(-8px);
            box-shadow: 
                0 50px 80px rgba(0, 0, 0, 0.7),
                inset -15px 0 30px rgba(45, 26, 15, 0.2),
                inset 15px 0 30px rgba(255, 255, 255, 0.3);
        }

        .book-top-ornament {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 28px;
            opacity: 0.2;
        }

        .book-bottom-ornament {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) scaleY(-1);
            width: 160px;
            height: 28px;
            opacity: 0.2;
        }

        .book-corner {
            position: absolute;
            width: 68px;
            height: 68px;
            opacity: 0.15;
        }

        .book-corner.tl {
            top: 18px;
            left: 18px;
        }

        .book-corner.tr {
            top: 18px;
            right: 18px;
            transform: scaleX(-1);
        }

        .book-corner.bl {
            bottom: 18px;
            left: 18px;
            transform: scaleY(-1);
        }

        .book-corner.br {
            bottom: 18px;
            right: 18px;
            transform: scale(-1);
        }

        .book-corner svg {
            width: 100%;
            height: 100%;
        }

        .book-content {
            position: relative;
            z-index: 2;
        }

        .book-title {
            font-family: 'Italianno', cursive;
            font-size: 5.1em;
            color: #2b1d12;
            margin-bottom: 28px;
            font-weight: 400;
        }

        .book-subtitle {
            font-size: 1.35em;
            color: #3a2415;
            font-style: italic;
            letter-spacing: 0.1em;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .book-divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(141, 79, 40, 0.6), transparent);
            margin: 30px auto 40px;
        }

        .book-tagline {
            font-family: 'Caveat', cursive;
            font-size: 1.8em;
            color: #2b1d12;
            margin: 28px 0;
            font-weight: 500;
        }

        .book-tags {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 34px 0 40px;
            flex-wrap: wrap;
            font-size: 1.05em;
            color: #3a2415;
        }

        .cta-button {
            display: inline-block;
            padding: 18px 56px;
            background: linear-gradient(135deg, #3a2415, #5b3a22);
            color: #f5e6d3;
            text-decoration: none;
            font-size: 1.12em;
            letter-spacing: 0.1em;
            border: 2px solid #2b1d12;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #2b1a0f, #3a2415);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 700px) {
            .book-container {
                max-width: 500px;
                height: 660px;
            }

            .book {
                padding: 58px 46px;
            }

            .book-title {
                font-size: 4.2em;
            }

            .book-subtitle {
                font-size: 1.15em;
            }

            .book-tagline {
                font-size: 1.55em;
            }

            .book-tags {
                font-size: 1em;
                margin: 30px 0 36px;
            }

            .cta-button {
                font-size: 1.02em;
                padding: 16px 48px;
            }
        }

        @media (max-width: 500px) {
            .book-container {
                max-width: 100%;
                height: 580px;
            }

            .book {
                padding: 46px 34px;
            }

            .book-title {
                font-size: 3.6em;
            }

            .book-subtitle {
                font-size: 1.02em;
            }

            .book-tagline {
                font-size: 1.3em;
            }

            .book-tags {
                font-size: 0.92em;
                gap: 10px;
                margin: 24px 0 30px;
            }

            .cta-button {
                font-size: 0.98em;
                padding: 14px 42px;
            }
        }
    </style>
</head>
<body>
    <div class="book-container">
        <div class="book">
            <!-- Book Corner Ornaments -->
            <div class="book-corner tl">
                <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 8 8 Q 15 5 25 10 Q 30 18 25 28 Q 15 32 8 28 Q 5 18 8 8" 
                          fill="none" stroke="#3a2415" stroke-width="1.2"/>
                    <circle cx="15" cy="15" r="2" fill="#3a2415"/>
                </svg>
            </div>
            <div class="book-corner tr">
                <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 8 8 Q 15 5 25 10 Q 30 18 25 28 Q 15 32 8 28 Q 5 18 8 8" 
                          fill="none" stroke="#3a2415" stroke-width="1.2"/>
                    <circle cx="15" cy="15" r="2" fill="#3a2415"/>
                </svg>
            </div>
            <div class="book-corner bl">
                <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 8 8 Q 15 5 25 10 Q 30 18 25 28 Q 15 32 8 28 Q 5 18 8 8" 
                          fill="none" stroke="#3a2415" stroke-width="1.2"/>
                    <circle cx="15" cy="15" r="2" fill="#3a2415"/>
                </svg>
            </div>
            <div class="book-corner br">
                <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 8 8 Q 15 5 25 10 Q 30 18 25 28 Q 15 32 8 28 Q 5 18 8 8" 
                          fill="none" stroke="#3a2415" stroke-width="1.2"/>
                    <circle cx="15" cy="15" r="2" fill="#3a2415"/>
                </svg>
            </div>

            <!-- Top Ornament -->
            <svg class="book-top-ornament" viewBox="0 0 120 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="top-book-pattern" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 3 Q 24 8 20 15 Q 16 8 20 3" fill="none" stroke="#3a2415" stroke-width="1" opacity="0.6"/>
                        <circle cx="20" cy="18" r="1.5" fill="#3a2415" opacity="0.5"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#top-book-pattern)"/>
            </svg>

            <!-- Bottom Ornament -->
            <svg class="book-bottom-ornament" viewBox="0 0 120 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="bottom-book-pattern" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 3 Q 24 8 20 15 Q 16 8 20 3" fill="none" stroke="#3a2415" stroke-width="1" opacity="0.6"/>
                        <circle cx="20" cy="18" r="1.5" fill="#3a2415" opacity="0.5"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#bottom-book-pattern)"/>
            </svg>

            <!-- Book Content -->
            <div class="book-content">
                <div class="book-title">Journal</div>
                <div class="book-subtitle">A Little More Than a CV</div>
                
                <div class="book-divider"></div>
                
                <div class="book-tagline">
                    A journal of the things that make me, me
                </div>

                <div class="book-tags">
                    <span>curiosity</span>
                    <span style="color: #94512a;">•</span>
                    <span>people</span>
                    <span style="color: #94512a;">•</span>
                    <span>places</span>
                    <span style="color: #94512a;">•</span>
                    <span>creativity</span>
                </div>

                <a href="Ipsita Journal CV.dc.html" class="cta-button">Open the Journal</a>
            </div>
        </div>
    </div>
</body>
</html>
