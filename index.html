<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita Journal CV</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italianno&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: linear-gradient(135deg, #6B4423 0%, #8B5A2B 50%, #A0522D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .button-container {
            text-align: center;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 55px;
            background: linear-gradient(135deg, #6B4423, #8B5A2B);
            color: #F5E6D3;
            text-decoration: none;
            border-radius: 0px;
            font-size: 1.15em;
            letter-spacing: 0.1em;
            border: 2px solid #3D2817;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #5C3820, #7A4E23);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="button-container">
        <a href="Ipsita Journal CV.dc.html" class="cta-button">Open the Journal</a>
    </div>
</body>
</html>
