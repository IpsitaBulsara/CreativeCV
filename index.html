<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita Journal CV - Creative Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italianno&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: linear-gradient(135deg, #4A3635 0%, #6B4C47 50%, #8B5A5A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .journal-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            perspective: 1000px;
        }

        .journal-book {
            background: linear-gradient(135deg, #D4A5A5 0%, #C9938F 50%, #BF8B86 100%);
            border-radius: 0px;
            padding: 50px 45px;
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.6),
                inset -12px 0 25px rgba(0, 0, 0, 0.25),
                inset 12px 0 25px rgba(255, 255, 255, 0.08);
            position: relative;
            border: 3px solid #8B6B60;
        }

        .journal-book::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 10px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.4), transparent);
        }

        .journal-book::after {
            content: '';
            position: absolute;
            left: 14px;
            top: 25px;
            bottom: 25px;
            width: 2px;
            background: repeating-linear-gradient(
                0deg,
                rgba(90, 58, 53, 0.4) 0px,
                rgba(90, 58, 53, 0.4) 3px,
                transparent 3px,
                transparent 10px
            );
        }

        .bookmark {
            position: absolute;
            right: -8px;
            top: 30%;
            width: 40px;
            height: 160px;
            background: linear-gradient(90deg, #A88080, #C4A090);
            box-shadow: -3px 0 8px rgba(0, 0, 0, 0.3);
            transform: rotate(-5deg);
            border: 1px solid #8B6B60;
        }

        .bookmark::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 20px;
            background: linear-gradient(180deg, #A88080, #8B6B60);
            clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
        }

        .journal-content {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .decorative-top {
            font-size: 2.2em;
            letter-spacing: 0.3em;
            color: rgba(90, 58, 53, 0.7);
            margin-bottom: 25px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .title {
            font-family: 'Italianno', cursive;
            font-size: 5.5em;
            color: #5A3A35;
            margin: 25px 0;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.55em;
            color: #6B4C47;
            font-style: italic;
            margin-bottom: 18px;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(90, 58, 53, 0.5), transparent);
            margin: 30px auto;
        }

        .heart {
            color: #8B6B60;
            font-size: 1.3em;
            margin: 0 12px;
        }

        .tagline {
            font-family: 'Caveat', cursive;
            font-size: 2em;
            color: #6B4C47;
            margin: 25px 0;
            font-weight: 500;
            line-height: 1.6;
        }

        .decorative-elements {
            position: absolute;
            font-size: 3.5em;
            opacity: 0.12;
            font-weight: 300;
            color: #5A3A35;
        }

        .element-top-left {
            top: 18px;
            left: 18px;
        }

        .element-top-right {
            top: 18px;
            right: 18px;
        }

        .element-bottom-left {
            bottom: 18px;
            left: 18px;
        }

        .element-bottom-right {
            bottom: 18px;
            right: 18px;
        }

        .cta-button {
            display: inline-block;
            padding: 18px 60px;
            margin-top: 35px;
            background: linear-gradient(135deg, #8B5A5A, #6B4C47);
            color: #F5E6E0;
            text-decoration: none;
            border-radius: 0px;
            font-size: 1.2em;
            letter-spacing: 0.1em;
            border: 2px solid #5A3A35;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #6B4C47, #5A3A35);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.95em;
            color: rgba(90, 58, 53, 0.6);
            letter-spacing: 0.1em;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 3.8em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            .tagline {
                font-size: 1.4em;
            }

            .journal-book {
                padding: 35px 30px;
            }

            .journal-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="journal-container">
        <div class="journal-book">
            <div class="decorative-elements element-top-left">✦</div>
            <div class="decorative-elements element-top-right">✦</div>
            <div class="decorative-elements element-bottom-left">✦</div>
            <div class="decorative-elements element-bottom-right">✦</div>

            <div class="bookmark"></div>

            <div class="journal-content">
                <div class="decorative-top">collect beautiful moments</div>

                <div class="title">Journal</div>

                <div class="subtitle">Dreams. Plans. Memories.</div>
                <div class="subtitle">All the little things</div>

                <div class="divider"></div>

                <div class="tagline">
                    A journal of the things that make me, me
                </div>

                <div class="divider"></div>

                <p style="font-family: 'Caveat', cursive; font-size: 1.6em; color: #6B4C47; margin: 25px 0; font-weight: 500;">
                    curiosity <span class="heart">•</span> people <span class="heart">•</span> places <span class="heart">•</span> creativity
                </p>

                <a href="Ipsita Journal CV.dc.html" class="cta-button">Open the Journal</a>

                <div class="footer">
                    <p style="margin-top: 35px; font-size: 0.9em; letter-spacing: 0.15em;">Written and assembled by Ipsita</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
