<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita Journal CV - Creative Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italianno&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: linear-gradient(135deg, #6B4423 0%, #8B5A2B 50%, #A0522D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .journal-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            perspective: 1000px;
        }

        .journal-book {
            background: linear-gradient(135deg, #8B6F47 0%, #A0826D 50%, #C4A57B 100%);
            border-radius: 0px;
            padding: 60px 50px;
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.5),
                inset -15px 0 30px rgba(0, 0, 0, 0.15),
                inset 15px 0 30px rgba(255, 255, 255, 0.05);
            position: relative;
            border: 3px solid #5C4033;
        }

        .journal-book::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.3), transparent);
        }

        .journal-book::after {
            content: '';
            position: absolute;
            left: 12px;
            top: 30px;
            bottom: 30px;
            width: 2px;
            background: repeating-linear-gradient(
                0deg,
                rgba(90, 58, 53, 0.3) 0px,
                rgba(90, 58, 53, 0.3) 3px,
                transparent 3px,
                transparent 12px
            );
        }

        .bookmark {
            position: absolute;
            right: -8px;
            top: 35%;
            width: 35px;
            height: 140px;
            background: linear-gradient(90deg, #8B6F47, #A0826D);
            box-shadow: -2px 0 6px rgba(0, 0, 0, 0.2);
            transform: rotate(-5deg);
            border: 1px solid #5C4033;
        }

        .bookmark::after {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 16px;
            background: linear-gradient(180deg, #8B6F47, #654321);
            clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
        }

        /* Ornamental decorative borders */
        .ornamental-border {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .corner-ornament {
            position: absolute;
            width: 60px;
            height: 60px;
            opacity: 0.25;
        }

        .corner-ornament svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 1px rgba(90, 58, 53, 0.3));
        }

        .top-left {
            top: 15px;
            left: 15px;
        }

        .top-right {
            top: 15px;
            right: 15px;
            transform: scaleX(-1);
        }

        .bottom-left {
            bottom: 15px;
            left: 15px;
            transform: scaleY(-1);
        }

        .bottom-right {
            bottom: 15px;
            right: 15px;
            transform: scale(-1);
        }

        .side-border-top {
            position: absolute;
            top: 20px;
            left: 80px;
            right: 80px;
            height: 25px;
            opacity: 0.2;
        }

        .side-border-bottom {
            position: absolute;
            bottom: 20px;
            left: 80px;
            right: 80px;
            height: 25px;
            opacity: 0.2;
            transform: scaleY(-1);
        }

        .journal-content {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .decorative-top {
            font-size: 1.8em;
            letter-spacing: 0.25em;
            color: rgba(90, 58, 53, 0.8);
            margin-bottom: 20px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .title {
            font-family: 'Italianno', cursive;
            font-size: 5.5em;
            color: #3D2817;
            margin: 20px 0;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.4em;
            color: #4C3828;
            font-style: italic;
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(90, 58, 53, 0.5), transparent);
            margin: 25px auto;
        }

        .heart {
            color: #6B4423;
            font-size: 1.2em;
            margin: 0 10px;
        }

        .tagline {
            font-family: 'Caveat', cursive;
            font-size: 1.8em;
            color: #4C3828;
            margin: 20px 0;
            font-weight: 500;
            line-height: 1.6;
        }

        .decorative-elements {
            position: absolute;
            font-size: 3em;
            opacity: 0.12;
            font-weight: 300;
            color: #3D2817;
        }

        .element-top-left {
            top: 40px;
            left: 30px;
        }

        .element-top-right {
            top: 40px;
            right: 30px;
        }

        .element-bottom-left {
            bottom: 40px;
            left: 30px;
        }

        .element-bottom-right {
            bottom: 40px;
            right: 30px;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 55px;
            margin-top: 30px;
            background: linear-gradient(135deg, #6B4423, #8B5A2B);
            color: #F5E6D3;
            text-decoration: none;
            border-radius: 0px;
            font-size: 1.15em;
            letter-spacing: 0.1em;
            border: 2px solid #3D2817;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #5C3820, #7A4E23);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9em;
            color: rgba(90, 58, 53, 0.65);
            letter-spacing: 0.1em;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 3.8em;
            }

            .subtitle {
                font-size: 1.1em;
            }

            .tagline {
                font-size: 1.3em;
            }

            .journal-book {
                padding: 40px 30px;
            }

            .journal-container {
                max-width: 100%;
            }

            .corner-ornament {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="journal-container">
        <div class="journal-book">
            <!-- Ornamental corners -->
            <div class="ornamental-border">
                <div class="corner-ornament top-left">
                    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 10 10 Q 20 5 30 10 Q 35 20 30 30 Q 20 35 10 30 Q 5 20 10 10" 
                              fill="none" stroke="#5C4033" stroke-width="1.5"/>
                        <circle cx="15" cy="15" r="3" fill="#5C4033"/>
                        <circle cx="25" cy="12" r="2" fill="#5C4033"/>
                        <path d="M 12 20 L 28 20" stroke="#5C4033" stroke-width="1" opacity="0.5"/>
                    </svg>
                </div>
                <div class="corner-ornament top-right">
                    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 10 10 Q 20 5 30 10 Q 35 20 30 30 Q 20 35 10 30 Q 5 20 10 10" 
                              fill="none" stroke="#5C4033" stroke-width="1.5"/>
                        <circle cx="15" cy="15" r="3" fill="#5C4033"/>
                        <circle cx="25" cy="12" r="2" fill="#5C4033"/>
                        <path d="M 12 20 L 28 20" stroke="#5C4033" stroke-width="1" opacity="0.5"/>
                    </svg>
                </div>
                <div class="corner-ornament bottom-left">
                    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 10 10 Q 20 5 30 10 Q 35 20 30 30 Q 20 35 10 30 Q 5 20 10 10" 
                              fill="none" stroke="#5C4033" stroke-width="1.5"/>
                        <circle cx="15" cy="15" r="3" fill="#5C4033"/>
                        <circle cx="25" cy="12" r="2" fill="#5C4033"/>
                        <path d="M 12 20 L 28 20" stroke="#5C4033" stroke-width="1" opacity="0.5"/>
                    </svg>
                </div>
                <div class="corner-ornament bottom-right">
                    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 10 10 Q 20 5 30 10 Q 35 20 30 30 Q 20 35 10 30 Q 5 20 10 10" 
                              fill="none" stroke="#5C4033" stroke-width="1.5"/>
                        <circle cx="15" cy="15" r="3" fill="#5C4033"/>
                        <circle cx="25" cy="12" r="2" fill="#5C4033"/>
                        <path d="M 12 20 L 28 20" stroke="#5C4033" stroke-width="1" opacity="0.5"/>
                    </svg>
                </div>

                <!-- Top and bottom borders -->
                <svg class="side-border-top" viewBox="0 0 600 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="top-pattern" x="0" y="0" width="60" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 30 5 Q 35 8 30 15 Q 25 8 30 5" fill="none" stroke="#5C4033" stroke-width="1" opacity="0.6"/>
                            <circle cx="30" cy="20" r="2" fill="#5C4033" opacity="0.5"/>
                            <path d="M 20 25 L 40 25" stroke="#5C4033" stroke-width="0.8" opacity="0.4"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#top-pattern)"/>
                </svg>

                <svg class="side-border-bottom" viewBox="0 0 600 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="bottom-pattern" x="0" y="0" width="60" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 30 5 Q 35 8 30 15 Q 25 8 30 5" fill="none" stroke="#5C4033" stroke-width="1" opacity="0.6"/>
                            <circle cx="30" cy="20" r="2" fill="#5C4033" opacity="0.5"/>
                            <path d="M 20 25 L 40 25" stroke="#5C4033" stroke-width="0.8" opacity="0.4"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#bottom-pattern)"/>
                </svg>
            </div>

            <div class="decorative-elements element-top-left">✦</div>
            <div class="decorative-elements element-top-right">✦</div>
            <div class="decorative-elements element-bottom-left">✦</div>
            <div class="decorative-elements element-bottom-right">✦</div>

            <div class="bookmark"></div>

            <div class="journal-content">
                <div class="decorative-top">collect beautiful moments</div>

                <div class="title">Journal</div>

                <div class="subtitle">Dreams. Plans. Memories.</div>
                <div class="subtitle">All the little things</div>

                <div class="divider"></div>

                <div class="tagline">
                    A journal of the things that make me, me
                </div>

                <div class="divider"></div>

                <p style="font-family: 'Caveat', cursive; font-size: 1.5em; color: #4C3828; margin: 20px 0; font-weight: 500;">
                    curiosity <span class="heart">•</span> people <span class="heart">•</span> places <span class="heart">•</span> creativity
                </p>

                <a href="Ipsita Journal CV.dc.html" class="cta-button">Open the Journal</a>

                <div class="footer">
                    <p style="margin-top: 30px; font-size: 0.85em; letter-spacing: 0.15em;">Written and assembled by Ipsita</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
